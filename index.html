<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloraHub - Online Gardening Community Platform</title>
  <link rel="stylesheet" href="./app.css?v=single_line_v3">
  <!-- Firebase App & Firestore Cloud SDK (Compat SDK for direct file:// browser execution) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    /* Immediate theme application before first paint to prevent screen flash */
    (function() {
      try {
        var raw = localStorage.getItem('GARDENING_COMMUNITY_DB_V2');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="javascript:void(0)" class="brand" onclick="navigate('home')">
        <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12" /><path d="M12 12C12 7 8 4 3 4c0 6 4 9 9 8z" fill="currentColor" fill-opacity="0.25" /><path d="M12 12c0-5 4-8 9-8 0 6-4 9-9 8z" fill="currentColor" fill-opacity="0.35" /><path d="M7 22h10" /></svg></div>
        <div style="display:flex; flex-direction:column; line-height:1.2; white-space:nowrap;">
          <span class="brand-title">FloraHub</span>
          <span class="brand-badge">Gardening Community</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links" id="navbarLinksSlot">
          <!-- Populated dynamically by app.js router -->
        </ul>
      </nav>

      <div class="header-actions">
        <div id="cloudStatusBadge" class="cloud-status-badge connecting" onclick="if(window.florahubSyncAllToCloud) window.florahubSyncAllToCloud()" style="cursor:pointer;" title="Click to trigger manual cloud synchronization">
          <span class="status-dot"></span>
          <span class="status-text">Connecting Cloud...</span>
        </div>
        <button id="tourGuideBtn" class="btn btn-tour" onclick="openOnboarding(0)" title="Explore Tour & Platform Guide" aria-label="Explore Tour & Platform Guide">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" fill-opacity="0.25"></polygon>
          </svg>
          <span>Tour Guide</span>
        </button>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <div id="navbarAuthSlot">
          <!-- Login/Register/User pill populated by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Dynamic Main Content Root -->
  <main id="appRoot" class="main-content">
    <!-- Rendered views inserted here -->
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Global Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal-content" id="modalSlot">
      <!-- Modal form injected dynamically -->
    </div>
  </div>

  <!-- Dedicated Onboarding Walkthrough Modal Overlay -->
  <div id="onboardingOverlay" class="onboarding-overlay" onclick="if(event.target === this) closeOnboarding(true)" role="dialog" aria-modal="true" aria-labelledby="onboardingModalTitle">
    <div class="onboarding-modal" id="onboardingSlot"></div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <p>&copy; 2026 Online Gardening Community Platform. Academic Project Submission.</p>
      <div style="display: flex; gap: 1.25rem;">
        <span style="color: var(--text-muted); font-size: 0.8rem;">Java 21 Enterprise Core Preserved</span>
        <span style="color: var(--text-muted); font-size: 0.8rem;">27 Unit Tests Passing</span>
        <span style="color: var(--text-muted); font-size: 0.8rem;">Zero-Dependency Offline Persistence</span>
      </div>
    </div>
  </footer>

  <!-- Local Firebase Config (Optional; excluded from Git) -->
  <script src="./firebase-config.js"></script>
  <!-- Application Logic & Local Storage Database -->
  <script src="./app.js?v=single_line_v3"></script>
</body>
</html>
