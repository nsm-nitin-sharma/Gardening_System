<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Sign In')}"></head>
<body class="auth-page">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="auth-wrapper">
    <div class="content-card auth-card">
        <h2 class="auth-title">Sign In</h2>
        <p class="auth-subtitle">Access your gardening profile and projects</p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Email Address</label>
                <input type="email" id="username" name="username" class="form-control" placeholder="gardener@gardening.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-auth-submit">Sign In</button>
        </form>

        <div class="auth-footer-link">
            Don't have an account yet? <a th:href="@{/register}" class="font-semibold">Register Here</a>
        </div>

        <div class="info-callout-dashed">
            <strong>Demo Credentials:</strong><br>
            • Admin: <code>admin@gardening.com</code> / <code>AdminPass123!</code><br>
            • Gardener: <code>gardener@gardening.com</code> / <code>GardenerPass123!</code>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
