<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header-head('Discussions Forum')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="content-area public-content-area">

    <div class="page-header">
        <div>
            <h1>Gardening Community Discussions</h1>
            <p class="page-subtitle">Ask questions, trade advice, and discuss seasonal gardening topics</p>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/gardener/discussions/new}" class="btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Start a New Discussion
            </a>
        </div>
    </div>

    <!-- Category Filter Bar -->
    <div class="content-card filter-card">
        <form th:action="@{/discussions}" method="get" class="filter-bar-form">
            <select name="category" class="form-control filter-select-lg">
                <option value="">All Topics</option>
                <option value="Pest Management" th:selected="${selectedCategory == 'Pest Management'}">Pest Management</option>
                <option value="Plant Diseases" th:selected="${selectedCategory == 'Plant Diseases'}">Plant Diseases</option>
                <option value="Composting & Soil" th:selected="${selectedCategory == 'Composting & Soil'}">Composting & Soil</option>
                <option value="Hydroponics & Indoor" th:selected="${selectedCategory == 'Hydroponics & Indoor'}">Hydroponics & Indoor</option>
                <option value="General Gardening" th:selected="${selectedCategory == 'General Gardening'}">General Gardening</option>
            </select>
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/discussions}" class="btn btn-secondary">Reset</a>
        </form>
    </div>

    <!-- Discussions List -->
    <div class="content-card">
        <div th:each="topic : ${topics}" class="list-row-item">
            <div>
                <span class="badge badge-harvesting mb-xs" th:text="${topic.category}">Category</span>
                <a th:href="@{'/discussions/view/' + ${topic.id}}" class="list-row-title" th:text="${topic.title}">Discussion Title</a>
                <div class="list-row-meta mt-xs" th:text="'Started by ' + ${topic.author.fullName} + ' • ' + ${#temporals.format(topic.createdAt, 'MMM dd, yyyy')} + ' • ' + ${#lists.size(topic.comments)} + ' Responses'">Metadata</div>
            </div>
            <a th:href="@{'/discussions/view/' + ${topic.id}}" class="btn btn-secondary btn-sm">View Discussion</a>
        </div>
        <div th:if="${#lists.isEmpty(topics)}" class="empty-state-box">
            No community discussion topics found in this category. Be the first to start a topic!
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
