<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header-head('Gardening Tips')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="content-area" style="margin: 0 auto; width: 100%;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1>Community Gardening Tips</h1>
            <p style="color: var(--neutral-500);">Explore crowd-sourced gardening advice, organic practices, and plant care guides</p>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/gardener/tips/submit}" class="btn btn-primary">+ Share a Tip</a>
        </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="content-card" style="margin-bottom: 2rem; padding: 1.25rem;">
        <form th:action="@{/tips}" method="get" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <input type="text" name="q" th:value="${searchQuery}" class="form-control" style="flex: 1; min-width: 240px;" placeholder="Search tips by title or topic...">
            <select name="category" class="form-control" style="width: 220px;">
                <option value="">All Categories</option>
                <option value="Vegetables & Herbs" th:selected="${selectedCategory == 'Vegetables & Herbs'}">Vegetables & Herbs</option>
                <option value="Soil & Fertilization" th:selected="${selectedCategory == 'Soil & Fertilization'}">Soil & Fertilization</option>
                <option value="Indoor Gardening" th:selected="${selectedCategory == 'Indoor Gardening'}">Indoor Gardening</option>
                <option value="Pest Control" th:selected="${selectedCategory == 'Pest Control'}">Pest Control</option>
                <option value="Flowers & Ornamentals" th:selected="${selectedCategory == 'Flowers & Ornamentals'}">Flowers & Ornamentals</option>
            </select>
            <button type="submit" class="btn btn-primary">Filter Tips</button>
            <a th:href="@{/tips}" class="btn btn-secondary">Reset</a>
        </form>
    </div>

    <!-- Tips Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
        <div th:each="tip : ${tips}" class="content-card" style="margin-bottom: 0; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <img th:if="${tip.imageUrl != null and !#strings.isEmpty(tip.imageUrl)}" th:src="${tip.imageUrl}" style="width: 100%; height: 190px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 1rem;" alt="Tip photo">
                <span class="badge badge-planning" th:text="${tip.category}" style="margin-bottom: 0.5rem;">Category</span>
                <h3 style="margin: 0.5rem 0 0.75rem 0;" th:text="${tip.title}">Tip Title</h3>
                <p style="color: var(--neutral-600); font-size: 0.92rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;" th:text="${tip.description}">Description preview</p>
            </div>
            <div style="margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--neutral-200); display: flex; justify-content: space-between; align-items: center;">
                <small style="color: var(--neutral-500);" th:text="'By ' + ${tip.author.fullName}">Author</small>
                <a th:href="@{'/tips/view/' + ${tip.id}}" class="btn btn-primary btn-sm">Read Tip Details</a>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(tips)}" style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-200);">
            <p style="color: var(--neutral-500); font-size: 1.1rem;">No approved tips found matching your search criteria.</p>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
