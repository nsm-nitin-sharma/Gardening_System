<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header-head('Gardening Tips')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="content-area public-content-area">

    <div class="page-header">
        <div>
            <h1>Community Gardening Tips</h1>
            <p class="page-subtitle">Explore crowd-sourced gardening advice, organic practices, and plant care guides</p>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/gardener/tips/submit}" class="btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Share a Tip
            </a>
        </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="content-card filter-card">
        <form th:action="@{/tips}" method="get" class="filter-bar-form">
            <input type="text" name="q" th:value="${searchQuery}" class="form-control filter-input-grow" placeholder="Search tips by title or topic...">
            <select name="category" class="form-control filter-select-fixed">
                <option value="">All Categories</option>
                <option value="Vegetables & Herbs" th:selected="${selectedCategory == 'Vegetables & Herbs'}">Vegetables & Herbs</option>
                <option value="Soil & Fertilization" th:selected="${selectedCategory == 'Soil & Fertilization'}">Soil & Fertilization</option>
                <option value="Indoor Gardening" th:selected="${selectedCategory == 'Indoor Gardening'}">Indoor Gardening</option>
                <option value="Pest Control" th:selected="${selectedCategory == 'Pest Control'}">Pest Control</option>
                <option value="Flowers & Ornamentals" th:selected="${selectedCategory == 'Flowers & Ornamentals'}">Flowers & Ornamentals</option>
            </select>
            <button type="submit" class="btn btn-primary">Filter Tips</button>
            <a th:href="@{/tips}" class="btn btn-secondary">Reset</a>
        </form>
    </div>

    <!-- Tips Grid -->
    <div class="cards-grid-320">
        <div th:each="tip : ${tips}" class="content-card flex-card-col interactive-card">
            <div>
                <img th:if="${tip.imageUrl != null and !#strings.isEmpty(tip.imageUrl)}" th:src="${tip.imageUrl}" class="card-thumbnail" alt="Tip photo">
                <span class="badge badge-planning mb-1" th:text="${tip.category}">Category</span>
                <h3 class="tip-card-title" th:text="${tip.title}">Tip Title</h3>
                <p class="tip-card-desc tip-clamp-4" th:text="${tip.description}">Description preview</p>
            </div>
            <div class="card-footer-meta">
                <small class="author-meta-text" th:text="'By ' + ${tip.author.fullName}">Author</small>
                <a th:href="@{'/tips/view/' + ${tip.id}}" class="btn btn-primary btn-sm">Read Tip Details</a>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(tips)}" class="empty-state-card">
            <p class="empty-state-text">No approved tips found matching your search criteria.</p>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
