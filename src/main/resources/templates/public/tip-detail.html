<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head(${tip.title})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="content-area detail-container">

    <div class="mb-3">
        <a th:href="@{/tips}" class="btn btn-secondary btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to All Tips
        </a>
    </div>

    <div class="content-card">
        <span class="badge badge-planning mb-2" th:text="${tip.category}">Category</span>
        <h1 class="mb-2" th:text="${tip.title}">Tip Title</h1>

        <div class="detail-header-meta">
            <div>Shared by <strong th:text="${tip.author.fullName}" class="text-contrast">Author Name</strong></div>
            <div>•</div>
            <div th:text="${#temporals.format(tip.createdAt, 'MMMM dd, yyyy')}">Date</div>
        </div>

        <img th:if="${tip.imageUrl != null and !#strings.isEmpty(tip.imageUrl)}" th:src="${tip.imageUrl}" class="detail-hero-image" alt="Tip photo">

        <div class="detail-body-text" th:text="${tip.description}">
            Tip full description
        </div>

        <div class="author-bio-box">
            <h4 class="mb-xs">About the Gardener</h4>
            <p class="author-bio-text" th:text="${tip.author.bio != null and !#strings.isEmpty(tip.author.bio)} ? ${tip.author.bio} : 'Gardener member of the platform.'">Bio</p>
            <div class="author-bio-meta">
                <span th:if="${tip.author.gardeningExperience != null}" th:text="'Experience: ' + ${tip.author.gardeningExperience}">Exp</span>
                <span th:if="${tip.author.location != null}" th:text="'Location: ' + ${tip.author.location}">Loc</span>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
