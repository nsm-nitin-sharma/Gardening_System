<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Share Gardening Tip')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="main-wrapper">
    <aside th:replace="~{fragments/layout :: gardener-sidebar('submit-tip')}"></aside>

    <main class="content-area max-w-800">
        <div class="page-header-simple">
            <h1>Share a Gardening Tip</h1>
            <p class="page-subtitle">Submit practical gardening advice, plant care tips, or organic techniques</p>
        </div>

        <div class="content-card">
            <form th:action="@{/gardener/tips/save}" method="post">
                <div class="form-group">
                    <label class="form-label" for="title">Tip Title *</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Companion Planting: Basil and Tomatoes" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Category *</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="Vegetables & Herbs">Vegetables & Herbs</option>
                        <option value="Soil & Fertilization">Soil & Fertilization</option>
                        <option value="Indoor Gardening">Indoor Gardening</option>
                        <option value="Pest Control">Pest Control</option>
                        <option value="Flowers & Ornamentals">Flowers & Ornamentals</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="imageUrl">Photo URL (Optional)</label>
                    <input type="url" id="imageUrl" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/...">
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Detailed Description & Instructions *</label>
                    <textarea id="description" name="description" class="form-control form-textarea-xl" placeholder="Explain the technique, materials required, and observed benefits..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
                    <span>Submit Gardening Tip</span>
                </button>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
