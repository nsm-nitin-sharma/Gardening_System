<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('My Shared Tips')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="main-wrapper">
    <aside th:replace="~{fragments/layout :: gardener-sidebar('my-tips')}"></aside>

    <main class="content-area">
        <div class="page-header">
            <div>
                <h1>My Shared Tips</h1>
                <p class="page-subtitle">Track the moderation approval status of your submitted gardening tips</p>
            </div>
            <a th:href="@{/gardener/tips/submit}" class="btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Share New Tip
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>

        <div class="content-card">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tip Title</th>
                            <th>Category</th>
                            <th>Moderation Status</th>
                            <th>Submitted Date</th>
                            <th>Moderation Note</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tip : ${tips}">
                            <td class="font-semibold" th:text="${tip.title}">Title</td>
                            <td th:text="${tip.category}">Category</td>
                            <td>
                                <span class="badge"
                                      th:classappend="'badge-' + ${#strings.toLowerCase(tip.status)}"
                                      th:text="${tip.status}">APPROVED</span>
                            </td>
                            <td th:text="${#temporals.format(tip.createdAt, 'MMM dd, yyyy')}">Date</td>
                            <td th:text="${tip.moderationNote != null ? tip.moderationNote : 'None'}">Note</td>
                            <td>
                                <a th:href="@{'/tips/view/' + ${tip.id}}" class="btn btn-secondary btn-sm">Preview</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tips)}">
                            <td colspan="6" class="table-empty-cell">
                                You have not submitted any gardening tips yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
