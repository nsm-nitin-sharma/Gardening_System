<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Start Discussion Topic')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="main-wrapper">
    <aside th:replace="~{fragments/layout :: gardener-sidebar('discussions')}"></aside>

    <main class="content-area max-w-800">
        <div class="page-header-simple">
            <h1>Start Discussion Topic</h1>
            <p class="page-subtitle">Ask a question or start a topic for community advice and discussion</p>
        </div>

        <div class="content-card">
            <form th:action="@{/gardener/discussions/save}" method="post">
                <div class="form-group">
                    <label class="form-label" for="title">Topic Title *</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Best organic remedies for aphids on chili peppers?" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Category *</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="Pest Management">Pest Management</option>
                        <option value="Plant Diseases">Plant Diseases</option>
                        <option value="Composting & Soil">Composting & Soil</option>
                        <option value="Hydroponics & Indoor">Hydroponics & Indoor</option>
                        <option value="General Gardening">General Gardening</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="content">Detailed Question / Discussion Content *</label>
                    <textarea id="content" name="content" class="form-control form-textarea-lg" placeholder="Provide details, growing conditions, symptoms, or context..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <span>Post Discussion Topic</span>
                </button>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
